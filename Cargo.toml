[workspace]
members = [
    "crates/core",
    "crates/server",
]
resolver = "3"

[workspace.dependencies]
# Utility.
anyhow = "1.0.97"
nom = "8.0.0"
svix-ksuid = "0.8.0"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["parsing", "formatting"] }

# CLI.
clap = { version = "4.5.35", features = ["derive"] }