[workspace]
members = [
    "crates/core",
    "crates/backend",
    "crates/server",
    "apps/server-cli",
    "apps/client-cli",
]
resolver = "3"

[workspace.dependencies]
# Error handling.
anyhow = "1.0.97"
thiserror = "2.0.12"

# Code generator.
derive_more = "2.0.1"
typed-builder = "0.21.0"

# Async.
tokio = "1"

# Random ID.
svix-ksuid = "0.8.0"

# Time.
time = "0.3.41"

# JSON serializer.
serde = "1.0"
serde_json = "1.0"

# Parser combinator.
nom = "8.0.0"

# CLI.
clap = "4.5.35"

# SQL.
sqlx = "0.8"

# HTTP server.
axum = "0.8.4"